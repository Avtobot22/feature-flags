name: Repository

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: repository-check
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check repository files
        run: python3 scripts/check_repository.py
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os
          import re

          title = os.environ['PR_TITLE']
          pattern = r'(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9./-]*\))?!?: [A-Za-z0-9].+'
          if not re.fullmatch(pattern, title) or not title.isascii():
              raise SystemExit('Use an English Conventional Commit title, e.g. feat(core): add flag definitions')
          PY
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${RUNNER_TEMP}/${archive}" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/actionlint"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/actionlint" actionlint
      - name: Lint workflows
        run: '"${RUNNER_TEMP}/actionlint/actionlint" -color'
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install Android build tools
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Check and build SDK
        run: ./gradlew qualityCheck :buildSrc:validatePlugins --stacktrace
      - name: Install Android test image
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'emulator' 'system-images;android-34;google_apis;x86_64'
      - name: Run Android assets tests
        timeout-minutes: 10
        run: |
          sudo chmod a+rw /dev/kvm
          printf 'no\n' | "${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager" create avd --name feature-flags-ci \
            --package 'system-images;android-34;google_apis;x86_64' --force
          emulator_bin="${ANDROID_HOME}/emulator/emulator"
          adb_bin="${ANDROID_HOME}/platform-tools/adb"
          "${emulator_bin}" -avd feature-flags-ci -port 5554 -no-window \
            -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect \
            > "${RUNNER_TEMP}/emulator.log" 2>&1 &
          emulator_pid=$!
          trap '"${adb_bin}" -s emulator-5554 emu kill || true' EXIT
          timeout 300 "${adb_bin}" -s emulator-5554 wait-for-device
          boot_deadline=$((SECONDS + 300))
          until [[ "$("${adb_bin}" -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" == '1' ]]; do
            if (( SECONDS >= boot_deadline )) || ! kill -0 "${emulator_pid}"; then
              cat "${RUNNER_TEMP}/emulator.log"
              exit 1
            fi
            sleep 2
          done
          ANDROID_SERIAL=emulator-5554 ./gradlew :feature-flags-android:connectedDebugAndroidTest --stacktrace
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/reports/
            buildSrc/build/reports/
            feature-flags-*/build/reports/
            feature-flags-*/build/outputs/androidTest-results/
            ${{ runner.temp }}/emulator.log
