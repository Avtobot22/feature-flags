name: Ошибка
description: Ошибка в SDK или сборке
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Как воспроизвести
      description: Версия SDK, окружение и минимальный пример.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Текст ошибки или лог без токенов и персональных данных.
    validations:
      required: true
